name: Bug report
description: Something isn't working as expected.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search [existing issues](../issues?q=is%3Aissue) first.
        **Security problems must not be reported here.** See SECURITY.md instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend (API)
        - Frontend (web app)
        - Docker / setup
        - Documentation
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Which role were you using?
      options:
        - Institute Admin
        - Trainer
        - Student
        - Not role-specific
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as …
        2. Open …
        3. Click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Paste any relevant output. Remove secrets, tokens, and personal data first.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. v0.1.0 or a1b2c3d
  - type: dropdown
    id: setup
    attributes:
      label: How are you running it?
      options:
        - Docker Compose
        - Manual setup
        - Other
